<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102b43"><meta name="description" content="2026 천안시 아동정책 인터랙티브 발표자료"><title>2026 천안시 아동정책 | 웹 프레젠테이션</title><style>
:root{color-scheme:dark;--bg:#081725;--panel:#102b43;--accent:#72e1d1;--muted:#a8bac9}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Pretendard,'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:white}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #78e8d8;outline-offset:3px}.app{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#183d54 0%,#081725 75%)}header{height:72px;display:flex;align-items:center;gap:20px;padding:0 clamp(16px,3vw,46px);border-bottom:1px solid #ffffff20;position:relative;z-index:5;background:#0b2132e8;backdrop-filter:blur(14px)}.brand{min-width:0;display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#5ddacb,#78a9ef);color:#092438;font-weight:900}.brand strong{font-size:15px;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.topnav{display:flex;gap:4px;margin-left:auto;overflow:auto;scrollbar-width:none}.topnav button{background:transparent;color:#b7cbd9;border:0;border-radius:10px;padding:10px 11px;white-space:nowrap;font-size:12px}.topnav button:hover,.topnav button.active{background:#ffffff18;color:white}.actions{display:flex;gap:8px}.iconbtn{border:1px solid #ffffff29;background:#ffffff0b;color:white;border-radius:12px;padding:9px 12px}.iconbtn:hover{background:#ffffff23}.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(12px,2.6vh,28px) clamp(12px,4vw,60px);gap:18px}.slide-shell{position:relative;width:min(100%,calc((100dvh - 210px)*16/9),1500px);aspect-ratio:16/9;box-shadow:0 25px 85px #0008;border-radius:12px;overflow:hidden;background:white;touch-action:pan-y}.slide-shell img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none}.slide-shell img.enter-next{animation:enterNext .55s cubic-bezier(.2,.8,.2,1)}.slide-shell img.enter-prev{animation:enterPrev .55s cubic-bezier(.2,.8,.2,1)}@keyframes enterNext{from{opacity:.3;transform:translateX(4%) scale(.985)}to{opacity:1;transform:none}}@keyframes enterPrev{from{opacity:.3;transform:translateX(-4%) scale(.985)}to{opacity:1;transform:none}}.slide-shell:after{content:'';position:absolute;inset:0;pointer-events:none;border:1px solid #ffffff20;border-radius:inherit}.counter{position:absolute;bottom:16px;right:17px;border-radius:30px;background:#082137ba;color:white;padding:8px 12px;font-size:12px;backdrop-filter:blur(10px)}.bottom{width:min(100%,1200px);display:flex;align-items:center;justify-content:space-between;gap:16px}.navbutton{display:flex;align-items:center;gap:8px;border:1px solid #ffffff33;background:#ffffff13;color:white;padding:12px 18px;border-radius:14px;transition:.2s}.navbutton:hover:not(:disabled){background:#ffffff29;transform:translateY(-2px)}.navbutton:disabled{opacity:.28;cursor:not-allowed}.center-info{text-align:center;min-width:0}.center-info strong{font-size:14px}.center-info p{font-size:12px;color:var(--muted);margin:5px 0 0}.progress{height:4px;background:#ffffff24;width:100%;position:fixed;bottom:0;left:0}.progress span{display:block;background:linear-gradient(90deg,#7de2c3,#74b8f0);height:100%;transition:width .45s}.overview{position:fixed;inset:0;z-index:20;background:#061522f5;backdrop-filter:blur(18px);padding:25px clamp(16px,4vw,60px);overflow:auto;display:none}.overview.open{display:block}.overview-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.overview h2{font-size:24px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:20px}.thumb{border:1px solid #ffffff30;border-radius:13px;background:#ffffff0a;padding:8px;text-align:left;color:white;transition:.2s}.thumb:hover{border-color:var(--accent);transform:translateY(-3px)}.thumb.selected{border-color:var(--accent)}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px}.thumb span{display:block;font-size:13px;padding:10px 5px 5px}.help{position:fixed;bottom:18px;left:20px;color:#b5c5d2;font-size:11px;opacity:.8}body.fullscreen header,body.fullscreen .bottom,body.fullscreen .help{display:none}body.fullscreen .stage{padding:0}body.fullscreen .slide-shell{width:min(100vw,calc(100dvh*16/9));border-radius:0}body.fullscreen .counter{display:none}@media(max-width:900px){header{height:auto;min-height:66px;flex-wrap:wrap;padding:12px 16px;gap:8px}.topnav{order:3;width:100%;margin:0}.topnav button{padding:8px}.actions{margin-left:auto}.stage{padding:14px 10px;justify-content:center}.slide-shell{width:100%}.bottom{gap:8px}.navbutton{padding:10px 12px;font-size:12px}.center-info strong{font-size:12px}.center-info p{font-size:11px}.help{display:none}}@media(max-width:420px){.brand strong{font-size:12px}.brand small{font-size:10px}.iconbtn{padding:8px}.center-info p{display:none}}
</style></head><body><div class="app"><header><div class="brand"><span class="mark">천</span><div><strong>2026 천안시 아동정책</strong><small>CHEONAN · CHILD POLICY</small></div></div><nav class="topnav" id="topnav" aria-label="슬라이드 목차"></nav><div class="actions"><button class="iconbtn" id="overviewBtn" title="전체 슬라이드 보기" aria-label="전체 슬라이드 보기">▦</button><button class="iconbtn" id="fullBtn" title="전체화면" aria-label="전체화면">⛶</button></div></header><main class="stage"><section class="slide-shell" id="slide" aria-label="프레젠테이션 슬라이드"><img id="slideImage" src="assets/slide-01.jpg" alt="첫 번째 슬라이드: 아이의 오늘이 천안의 미래입니다"><div class="counter" id="counter">01 / 10</div></section><div class="bottom"><button class="navbutton" id="prev" aria-label="이전 슬라이드">← 이전</button><div class="center-info"><strong id="title">아이의 오늘이 천안의 미래입니다</strong><p id="subtitle">방향키 · 스와이프 · 스크롤로 이동</p></div><button class="navbutton" id="next" aria-label="다음 슬라이드">다음 →</button></div></main><div class="progress" aria-hidden="true"><span id="bar"></span></div><span class="help">← → 키보드 이동 · F 전체화면 · G 전체 보기 · Home/End 처음/끝</span></div><div class="overview" id="overview" role="dialog" aria-modal="true" aria-label="전체 슬라이드"><div class="overview-head"><h2>전체 슬라이드 <span style="font-size:14px;color:#9db4c7;font-weight:400">10장</span></h2><button class="iconbtn" id="closeOverview">✕ 닫기</button></div><div class="grid" id="thumbs"></div></div><script>
const titles=['아이의 오늘이 천안의 미래입니다','아동의 성장 단계에 맞춘 통합 지원','정책 현황을 읽는 3가지 관점','가정의 시작부터, 건강한 성장까지','학교 밖 시간도 안전하고 풍요롭게','한 명의 아이도 놓치지 않는 보호체계','정책의 가치는 아이의 성장에서 보입니다','정책 성과는 수치와 경험으로 확인','앞으로의 발전 방향','아이의 가능성이 도시의 미래가 되도록'];const sections=['표지','정책 개요','정책 현황','양육·건강','돌봄·문화','아동 보호','정책 홍보','성과 지표','발전 방향','마무리'];const images=titles.map((_,i)=>`assets/slide-${String(i+1).padStart(2,'0')}.jpg`);let current=0,locked=false;const $=id=>document.getElementById(id);const nav=$('topnav'),thumbs=$('thumbs');sections.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>go(i);nav.appendChild(b);let t=document.createElement('button');t.className='thumb';t.innerHTML=`<img loading="lazy" src="${images[i]}" alt="${titles[i]}"><span>${String(i+1).padStart(2,'0')} · ${titles[i]}</span>`;t.onclick=()=>{go(i);toggleOverview(false)};thumbs.appendChild(t)});function go(i){i=Math.max(0,Math.min(9,i));if(i===current)return;let direction=i>current?'enter-next':'enter-prev';current=i;render(direction);history.replaceState(null,'',`#slide-${i+1}`)}function render(anim=''){const im=$('slideImage');im.className='';im.src=images[current];im.alt=`${current+1}번 슬라이드: ${titles[current]}`;void im.offsetWidth;im.className=anim;$('title').textContent=titles[current];$('counter').textContent=`${String(current+1).padStart(2,'0')} / 10`;$('bar').style.width=`${(current+1)*10}%`;$('prev').disabled=current===0;$('next').disabled=current===9;[...nav.children].forEach((b,i)=>{b.classList.toggle('active',i===current);if(i===current)b.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})});[...thumbs.children].forEach((b,i)=>b.classList.toggle('selected',i===current))}function toggleOverview(open){$('overview').classList.toggle('open',open);document.body.style.overflow=open?'hidden':''}function full(){if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen?.().catch(()=>{document.body.classList.toggle('fullscreen')})}}$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('overviewBtn').onclick=()=>toggleOverview(true);$('closeOverview').onclick=()=>toggleOverview(false);$('fullBtn').onclick=full;document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));document.addEventListener('keydown',e=>{if($('overview').classList.contains('open')){if(e.key==='Escape')toggleOverview(false);return}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(9);else if(e.key.toLowerCase()==='g')toggleOverview(true);else if(e.key.toLowerCase()==='f')full()});let startX=0,startY=0;$('slide').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});$('slide').addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)go(current+(dx<0?1:-1))},{passive:true});$('slide').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<18||locked)return;locked=true;go(current+(e.deltaY>0?1:-1));setTimeout(()=>locked=false,650)},{passive:true});let hash=location.hash.match(/slide-(\d+)/);if(hash)current=Math.max(0,Math.min(9,Number(hash[1])-1));render();images.forEach(src=>{let im=new Image();im.src=src});
</script></body></html>
